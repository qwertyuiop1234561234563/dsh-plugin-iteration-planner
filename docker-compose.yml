services:
  # --------------------------- 存储：PostgreSQL ---------------------------
  postgres:
    image: postgres:16-alpine
    container_name: iteration-planner-postgres
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: iteration_planner
      # 中文环境下的排序与编码
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U planner -d iteration_planner']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # -------------------- 内部算法引擎：TS 插件 + Fastify --------------------
  # 仅在内网暴露（expose），不映射到宿主机；作为「算法单一事实来源」
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iteration-planner-engine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8080
      API_BASE_PATH: /api
      # 引擎仅在集群内网被 Python 服务调用，不再对外鉴权（由 Python 层统一鉴权）
      API_CORS_ORIGIN: '*'
      API_TOKEN: ''
      STORAGE_DRIVER: postgres
      DATABASE_URL: postgres://planner:planner@postgres:5432/iteration_planner
      # 引擎不托管前端（由 Python 容器托管）
      WEB_STATIC_DIR: ''
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_ENABLE_SWAGGER: 'false'
      PLANNER_FALLBACK_TO_RULE: ${PLANNER_FALLBACK_TO_RULE:-true}
      # 引擎侧 LLM 拆解主路径（留空则规则拆解，离线可复现）
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    expose:
      - '8080'
    restart: unless-stopped

  # ------------------- 对外服务：Python API + Agent + SPA -------------------
  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: iteration-planner-python
    depends_on:
      - engine
      - postgres
    environment:
      API_HOST: 0.0.0.0
      # 本网关监听端口（独立于引擎的 API_PORT，避免本地联调抢同一个端口）
      GATEWAY_PORT: 8080
      API_BASE_PATH: /api
      API_WS_PATH: /ws
      # 同域部署时 CORS 可收紧；此处默认放开，便于前后端分离联调
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-*}
      # 机器 / CI 访问令牌（Bearer，服务账号语义；人类用户走登录 + 会话 Cookie）
      API_TOKEN: ${API_TOKEN:-}
      # 访问控制（登录 + 角色）：账号库与 Chroma 共用 /app/.data 卷，重建镜像不丢账号
      AUTH_ENABLED: ${AUTH_ENABLED:-true}
      AUTH_STORE_PATH: /app/.data/auth.db
      AUTH_SESSION_COOKIE: ${AUTH_SESSION_COOKIE:-ip_session}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-28800}
      # 生产环境经 HTTPS 部署时务必置为 true；同时按需将 SameSite 收紧为 strict
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_COOKIE_SAMESITE: ${AUTH_COOKIE_SAMESITE:-lax}
      AUTH_BOOTSTRAP_ADMIN_USERNAME: ${AUTH_BOOTSTRAP_ADMIN_USERNAME:-admin}
      # 留空则首启自动生成随机口令并以 WARNING 日志打印一次，登录后请立即更换
      AUTH_BOOTSTRAP_ADMIN_PASSWORD: ${AUTH_BOOTSTRAP_ADMIN_PASSWORD:-}
      # 内部算法引擎地址（容器名解析）
      ENGINE_BASE_URL: http://engine:8080
      ENGINE_TIMEOUT_SECONDS: ${ENGINE_TIMEOUT_SECONDS:-60}
      ENGINE_CONNECT_TIMEOUT_SECONDS: ${ENGINE_CONNECT_TIMEOUT_SECONDS:-5}
      # 长耗时写（建计划 / 重规划）的读超时；引擎侧这两个接口同步阻塞 80s+，
      # 沿用 60s 会导致「客户端报失败、引擎已落库」的孤儿写（超时→504，连不上才是 502）
      ENGINE_LONG_TIMEOUT_SECONDS: ${ENGINE_LONG_TIMEOUT_SECONDS:-600}
      ENGINE_JOB_TIMEOUT_SECONDS: ${ENGINE_JOB_TIMEOUT_SECONDS:-600}
      ENGINE_RETRY_ATTEMPTS: ${ENGINE_RETRY_ATTEMPTS:-2}
      ENGINE_BREAKER_THRESHOLD: ${ENGINE_BREAKER_THRESHOLD:-5}
      ENGINE_BREAKER_RECOVERY_SECONDS: ${ENGINE_BREAKER_RECOVERY_SECONDS:-30}
      # 同域托管前端 SPA 产物
      WEB_STATIC_DIR: /app/web/dist
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 安全 / 可观测 / 运维
      API_SECURITY_HEADERS: ${API_SECURITY_HEADERS:-true}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-0}
      API_RATE_LIMIT_BURST: ${API_RATE_LIMIT_BURST:-0}
      # 限流后端：auto（有 REDIS_URL 则用 Redis 共享令牌桶）| memory | redis
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-auto}
      # 可信反代地址清单（逗号分隔 IP/CIDR）；仅在直连对端命中时才采信 X-Forwarded-For
      API_TRUSTED_PROXIES: ${API_TRUSTED_PROXIES:-}
      # 请求体大小上限（字节，0 关闭）；超限即 413，须 ≥ KB_MAX_DOCUMENT_BYTES + multipart 开销
      API_MAX_BODY_BYTES: ${API_MAX_BODY_BYTES:-33554432}
      API_WORKERS: ${API_WORKERS:-1}
      WS_REPLAY_SIZE: ${WS_REPLAY_SIZE:-20}
      # 单客户端事件下发超时（秒，防慢客户端拖住扇出）与在线客户端上限（0 不限）
      WS_SEND_TIMEOUT_SECONDS: ${WS_SEND_TIMEOUT_SECONDS:-5.0}
      WS_MAX_CLIENTS: ${WS_MAX_CLIENTS:-512}
      # Agent 编排（配置 LLM 端点与模型即启用 /api/agent/*；密钥可选，兼容无鉴权自建网关）
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
      AGENT_TEMPERATURE: ${AGENT_TEMPERATURE:-0.2}
      AGENT_MAX_CONTEXT_CHARS: ${AGENT_MAX_CONTEXT_CHARS:-96000}
      # 多角色协作（planner/estimator/risk/critic）单次最多产出的角色步骤数
      AGENT_COLLAB_MAX_STEPS: ${AGENT_COLLAB_MAX_STEPS:-6}
      AGENT_SESSION_TTL_SECONDS: ${AGENT_SESSION_TTL_SECONDS:-3600}
      # 会话存储：单副本用 memory；多副本/多 worker 改为 redis 并设置 REDIS_URL
      SESSION_STORE: ${SESSION_STORE:-memory}
      REDIS_URL: ${REDIS_URL:-}
      # 主动巡检（后台巡检 Agent）：只聚合引擎事实 + 增量比对，经 WS 推送增量预警
      PATROL_ENABLED: ${PATROL_ENABLED:-true}
      PATROL_INTERVAL_SECONDS: ${PATROL_INTERVAL_SECONDS:-300}
      PATROL_MAX_PLANS: ${PATROL_MAX_PLANS:-20}
      PATROL_ALERT_COOLDOWN_SECONDS: ${PATROL_ALERT_COOLDOWN_SECONDS:-1800}
      PATROL_FINDING_TTL_SECONDS: ${PATROL_FINDING_TTL_SECONDS:-86400}
      PATROL_MAX_FINDINGS: ${PATROL_MAX_FINDINGS:-200}
      PATROL_ESCALATE_SEVERITY: ${PATROL_ESCALATE_SEVERITY:-critical}
      # 迭代复盘 + 学习：确定性统计 + 结论，可选写回长期记忆（闭环反哺后续规划）
      RETRO_WRITE_MEMORY: ${RETRO_WRITE_MEMORY:-true}
      RETRO_MAX_MEMORIES: ${RETRO_MAX_MEMORIES:-4}
      # What-if 沙盘：自然语言情景 → 临时计划 → 引擎重算 → 增量对比（临时计划即时回收）
      WHATIF_MAX_TASK_EDITS: ${WHATIF_MAX_TASK_EDITS:-10}
      # 缓存加速（可选）：保存确定性的向量化结果，重复问答省掉上游往返；故障 fail-open
      CACHE_BACKEND: ${CACHE_BACKEND:-auto}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-2048}
      # 异步写作业 + 幂等键：作业是**状态**而非缓存，多副本/多 worker 必须 JOB_STORE=redis
      # （显式填 redis 却缺 REDIS_URL 或未装 redis 依赖会启动失败，不静默降级）
      JOB_STORE: ${JOB_STORE:-auto}
      JOB_TTL_SECONDS: ${JOB_TTL_SECONDS:-3600}
      JOB_MAX_ENTRIES: ${JOB_MAX_ENTRIES:-1024}
      IDEMPOTENCY_TTL_SECONDS: ${IDEMPOTENCY_TTL_SECONDS:-86400}
      # MCP Server：把 Agent 既有工具原样注册为 MCP 工具（stdio 由独立进程启动，不受本开关影响）
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_SERVER_NAME: ${MCP_SERVER_NAME:-iteration-planner}
      MCP_TOKEN: ${MCP_TOKEN:-}
      MCP_MAX_RESULT_CHARS: ${MCP_MAX_RESULT_CHARS:-200000}
      MCP_MAX_BODY_BYTES: ${MCP_MAX_BODY_BYTES:-2097152}
      # 运行台账（持久化检查点）：两阶段写确认的待确认动作落盘，重启/换副本后可继续确认；
      # 台账是**状态**而非缓存，故障返 503 不静默降级 —— 多副本/多 worker 必须 CHECKPOINT_STORE=redis
      CHECKPOINT_STORE: ${CHECKPOINT_STORE:-auto}
      CHECKPOINT_TTL_SECONDS: ${CHECKPOINT_TTL_SECONDS:-604800}
      CHECKPOINT_MAX_ENTRIES: ${CHECKPOINT_MAX_ENTRIES:-2048}
      CHECKPOINT_MAX_ATTEMPTS: ${CHECKPOINT_MAX_ATTEMPTS:-3}
      # 评测台：黄金集 + 确定性断言（硬门槛）+ LLM 评委（补充权重），CI 门禁据阈值返回退出码
      EVALS_ENABLED: ${EVALS_ENABLED:-true}
      EVALS_JUDGE_ENABLED: ${EVALS_JUDGE_ENABLED:-true}
      EVALS_MAX_CASES: ${EVALS_MAX_CASES:-100}
      EVALS_GATE_PASS_RATE: ${EVALS_GATE_PASS_RATE:-0.8}
      EVALS_GATE_MIN_SCORE: ${EVALS_GATE_MIN_SCORE:-0.7}
      # 自反思自愈：稳定错误码 → 确定性归因 → 换参/换工具重试，超限熔断降级（非模型自述，可复算）
      AGENT_REFLECT_ENABLED: ${AGENT_REFLECT_ENABLED:-true}
      AGENT_REFLECT_MAX_RETRIES: ${AGENT_REFLECT_MAX_RETRIES:-2}
      # 知识库（RAG）与长期记忆：默认硅基流动 BAAI/bge-m3（长期免费，固定 1024 维）；
      # 两行 EMBEDDING_BASE_URL / EMBEDDING_API_KEY 均留空时才回落 LLM_*（智谱同一端点兼做 embeddings）
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.siliconflow.cn/v1}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      # 仅支持自定义维度的模型（智谱 embedding-3 / Qwen3-Embedding 系列）才需开启：
      # bge-m3 等固定维度模型下发 dimensions 会被上游判为非法参数
      EMBEDDING_SEND_DIMENSIONS: ${EMBEDDING_SEND_DIMENSIONS:-false}
      VECTOR_STORE: ${VECTOR_STORE:-chroma}
      CHROMA_DIR: /app/.data/chroma
      KB_CHUNK_SIZE: ${KB_CHUNK_SIZE:-800}
      KB_CHUNK_OVERLAP: ${KB_CHUNK_OVERLAP:-120}
      KB_TOP_K: ${KB_TOP_K:-4}
      KB_HYBRID: ${KB_HYBRID:-true}
      KB_AUTO_INJECT: ${KB_AUTO_INJECT:-true}
      KB_INJECT_TOP_K: ${KB_INJECT_TOP_K:-3}
      # 文档详情分块预览上限（chunkCount 仍为真实总数）
      KB_DETAIL_PREVIEW_CHUNKS: ${KB_DETAIL_PREVIEW_CHUNKS:-50}
      MEMORY_ENABLED: ${MEMORY_ENABLED:-true}
      MEMORY_EXTRACT: ${MEMORY_EXTRACT:-true}
      MEMORY_TOP_K: ${MEMORY_TOP_K:-4}
    ports:
      - '${APP_PORT:-8080}:8080'
    volumes:
      # 向量库本地持久化（Chroma 为单进程嵌入式库，重建镜像不丢库）
      - chromadata:/app/.data
    restart: unless-stopped

  # ------------------- 可选：Redis（多副本共享会话时启用） -------------------
  # 使用方式：设置 SESSION_STORE=redis 与 REDIS_URL=redis://redis:6379/0，并执行
  #   docker compose --profile redis up -d --build
  redis:
    image: redis:7-alpine
    container_name: iteration-planner-redis
    profiles: ['redis']
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  chromadata: