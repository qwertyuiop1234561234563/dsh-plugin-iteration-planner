services:
  # --------------------------- 存储：PostgreSQL ---------------------------
  postgres:
    image: postgres:16-alpine
    container_name: iteration-planner-postgres
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: iteration_planner
      # 中文环境下的排序与编码
      POSTGRES_INITDB_ARGS: '--encoding=UTF8'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U planner -d iteration_planner']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # -------------------- 内部算法引擎：TS 插件 + Fastify --------------------
  # 仅在内网暴露（expose），不映射到宿主机；作为「算法单一事实来源」
  engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iteration-planner-engine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8080
      API_BASE_PATH: /api
      # 引擎仅在集群内网被 Python 服务调用，不再对外鉴权（由 Python 层统一鉴权）
      API_CORS_ORIGIN: '*'
      API_TOKEN: ''
      STORAGE_DRIVER: postgres
      DATABASE_URL: postgres://planner:planner@postgres:5432/iteration_planner
      # 引擎不托管前端（由 Python 容器托管）
      WEB_STATIC_DIR: ''
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_ENABLE_SWAGGER: 'false'
      PLANNER_FALLBACK_TO_RULE: ${PLANNER_FALLBACK_TO_RULE:-true}
      # 引擎侧 LLM 拆解主路径（留空则规则拆解，离线可复现）
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    expose:
      - '8080'
    restart: unless-stopped

  # ------------------- 对外服务：Python API + Agent + SPA -------------------
  python:
    build:
      context: .
      dockerfile: Dockerfile.python
    container_name: iteration-planner-python
    depends_on:
      - engine
      - postgres
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 8080
      API_BASE_PATH: /api
      API_WS_PATH: /ws
      # 同域部署时 CORS 可收紧；此处默认放开，便于前后端分离联调
      API_CORS_ORIGIN: ${API_CORS_ORIGIN:-*}
      # 对外统一鉴权（留空表示不鉴权；生产环境务必配置）
      API_TOKEN: ${API_TOKEN:-}
      # 内部算法引擎地址（容器名解析）
      ENGINE_BASE_URL: http://engine:8080
      ENGINE_TIMEOUT_SECONDS: ${ENGINE_TIMEOUT_SECONDS:-60}
      ENGINE_CONNECT_TIMEOUT_SECONDS: ${ENGINE_CONNECT_TIMEOUT_SECONDS:-5}
      ENGINE_RETRY_ATTEMPTS: ${ENGINE_RETRY_ATTEMPTS:-2}
      ENGINE_BREAKER_THRESHOLD: ${ENGINE_BREAKER_THRESHOLD:-5}
      ENGINE_BREAKER_RECOVERY_SECONDS: ${ENGINE_BREAKER_RECOVERY_SECONDS:-30}
      # 同域托管前端 SPA 产物
      WEB_STATIC_DIR: /app/web/dist
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # 安全 / 可观测 / 运维
      API_SECURITY_HEADERS: ${API_SECURITY_HEADERS:-true}
      API_RATE_LIMIT_PER_MINUTE: ${API_RATE_LIMIT_PER_MINUTE:-0}
      API_RATE_LIMIT_BURST: ${API_RATE_LIMIT_BURST:-0}
      # 限流后端：auto（有 REDIS_URL 则用 Redis 共享令牌桶）| memory | redis
      RATE_LIMIT_BACKEND: ${RATE_LIMIT_BACKEND:-auto}
      # 可信反代地址清单（逗号分隔 IP/CIDR）；仅在直连对端命中时才采信 X-Forwarded-For
      API_TRUSTED_PROXIES: ${API_TRUSTED_PROXIES:-}
      # 请求体大小上限（字节，0 关闭）；超限即 413，须 ≥ KB_MAX_DOCUMENT_BYTES + multipart 开销
      API_MAX_BODY_BYTES: ${API_MAX_BODY_BYTES:-33554432}
      API_WORKERS: ${API_WORKERS:-1}
      WS_REPLAY_SIZE: ${WS_REPLAY_SIZE:-20}
      # 单客户端事件下发超时（秒，防慢客户端拖住扇出）与在线客户端上限（0 不限）
      WS_SEND_TIMEOUT_SECONDS: ${WS_SEND_TIMEOUT_SECONDS:-5.0}
      WS_MAX_CLIENTS: ${WS_MAX_CLIENTS:-512}
      # Agent 编排（LLM 三项齐全才启用 /api/agent/*）
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      AGENT_MAX_STEPS: ${AGENT_MAX_STEPS:-8}
      AGENT_TEMPERATURE: ${AGENT_TEMPERATURE:-0.2}
      AGENT_MAX_CONTEXT_CHARS: ${AGENT_MAX_CONTEXT_CHARS:-96000}
      AGENT_SESSION_TTL_SECONDS: ${AGENT_SESSION_TTL_SECONDS:-3600}
      # 会话存储：单副本用 memory；多副本/多 worker 改为 redis 并设置 REDIS_URL
      SESSION_STORE: ${SESSION_STORE:-memory}
      REDIS_URL: ${REDIS_URL:-}
      # 缓存加速（可选）：保存确定性的向量化结果，重复问答省掉上游往返；故障 fail-open
      CACHE_BACKEND: ${CACHE_BACKEND:-auto}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      CACHE_MAX_ENTRIES: ${CACHE_MAX_ENTRIES:-2048}
      # 知识库（RAG）与长期记忆：留空 EMBEDDING_* 则回落 LLM_*（智谱同一端点兼做 embeddings）
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embedding-3}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1024}
      VECTOR_STORE: ${VECTOR_STORE:-chroma}
      CHROMA_DIR: /app/.data/chroma
      KB_CHUNK_SIZE: ${KB_CHUNK_SIZE:-800}
      KB_CHUNK_OVERLAP: ${KB_CHUNK_OVERLAP:-120}
      KB_TOP_K: ${KB_TOP_K:-4}
      KB_HYBRID: ${KB_HYBRID:-true}
      KB_AUTO_INJECT: ${KB_AUTO_INJECT:-true}
      KB_INJECT_TOP_K: ${KB_INJECT_TOP_K:-3}
      # 文档详情分块预览上限（chunkCount 仍为真实总数）
      KB_DETAIL_PREVIEW_CHUNKS: ${KB_DETAIL_PREVIEW_CHUNKS:-50}
      MEMORY_ENABLED: ${MEMORY_ENABLED:-true}
      MEMORY_EXTRACT: ${MEMORY_EXTRACT:-true}
      MEMORY_TOP_K: ${MEMORY_TOP_K:-4}
    ports:
      - '${APP_PORT:-8080}:8080'
    volumes:
      # 向量库本地持久化（Chroma 为单进程嵌入式库，重建镜像不丢库）
      - chromadata:/app/.data
    restart: unless-stopped

  # ------------------- 可选：Redis（多副本共享会话时启用） -------------------
  # 使用方式：设置 SESSION_STORE=redis 与 REDIS_URL=redis://redis:6379/0，并执行
  #   docker compose --profile redis up -d --build
  redis:
    image: redis:7-alpine
    container_name: iteration-planner-redis
    profiles: ['redis']
    command: ['redis-server', '--save', '60', '1', '--loglevel', 'warning']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  chromadata: