# ============================================================================
# 可选：Nginx 反向代理网关
#
# 默认部署形态下，Fastify 已同域托管前端 SPA（web/dist）与 REST/WebSocket，
# 直接暴露 8080 端口即可，无需本文件。
#
# 以下配置适用于需要 Nginx 做 TLS 终止、域名接入或统一网关的场景：
#   docker run -v $PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro nginx:alpine
#   并确保 upstream 能解析到应用容器名 app:8080（同一 docker 网络内）。
# ============================================================================

upstream iteration_planner_app {
    server app:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 上传需求文本等请求体上限，与后端 bodyLimit(2MB) 对齐
    client_max_body_size 4m;

    # WebSocket 事件推送：必须显式升级协议头
    location /ws {
        proxy_pass http://iteration_planner_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 浏览器无法给 WebSocket 自定义请求头，令牌只能随查询串下发（?token=）；
        # 默认 combined 日志格式会原样记录 $request，等于把访问令牌写进磁盘，
        # 因此这里关闭访问日志（令牌仍在内存中的请求里，不落盘）。
        access_log off;
        # 长连接保活：心跳 30s，读超时放宽避免误断
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # REST API 与前端静态资源统一转发（含 Swagger UI：/api/docs）
    location / {
        proxy_pass http://iteration_planner_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 规划流水线（含 LLM 拆解）耗时较长，放宽网关超时
        proxy_read_timeout 180s;
    }
}