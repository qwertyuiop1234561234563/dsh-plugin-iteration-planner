name: CI

# 门槛：push / PR 即跑「算法引擎（TS）+ 对外服务（Python）+ 控制台（Vue3）」
# 三套门禁，避免只在本地 pytest 通过、跨贡献者退化。
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ------------------------- 算法引擎（TypeScript） -------------------------
  # 算法单一事实来源：Kahn 拓扑 / AOE 关键路径 / 风险扫描 / 燃尽图的回归门禁
  engine:
    name: 算法引擎（TS）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
      - name: 单元测试
        run: npm test

  # --------------------- 对外服务（Python API + Agent） ---------------------
  python:
    name: 对外服务（Python）
    runs-on: ubuntu-latest
    services:
      # 起真实 Redis：让「跨副本共享会话 / 共享配额 / 共享缓存」用例在 CI 真实执行，
      # 而不是因本机无实例被跳过（本地默认地址即 127.0.0.1:6379/15）。
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          # 缓存键需覆盖全部依赖清单：requirements-dev.txt 以 -r 相对引用 requirements.txt，
          # 漏掉任一文件都会让缓存命中旧依赖（CI 静默用错版本）
          cache-dependency-path: |
            python/requirements.txt
            python/requirements-dev.txt
            python/requirements-redis.txt
      - name: 安装运行时与开发依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements-dev.txt
          python -m pip install -r python/requirements-redis.txt
      - name: 语法门禁（编译全部模块）
        run: python -m compileall -q python/app python/run.py
      - name: 单元与集成测试
        working-directory: python
        env:
          REDIS_URL: redis://127.0.0.1:6379/15
        run: python -m pytest
      # 评测门禁：只跑确定性自愈演练（脚本化模型 + 桩调度器，不需要真实引擎 / LLM），
      # 因此离线环境也能稳定给出结论。退出码即门禁结论，失败直接红灯。
      - name: Agent 评测门禁（自愈演练）
        working-directory: python
        run: python -m app.evals.gate --kind reflection --no-judge

  # ---------------------------- 控制台（Vue3） ----------------------------
  web:
    name: 控制台（Vue3）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: 类型检查
        run: npm run typecheck
